version = 2
requires-python = ">=3.12"

[workspace]
dependencies = [
    { name = "httpx", specifier = ">=0.27,<0.28" },

    { name = "rich", specifier = ">=13.7,<14" },

    { name = "tomli", specifier = ">=2,<3" },
]

[[package]]
name = "anyio"
version = "4.6.2.post1"
source = { registry = "../wheelhouse" }
dependencies = [
    "idna",
    "sniffio",
]
wheels = [
    { path = "anyio-4.6.2.post1-py3-none-any.whl" },
]

